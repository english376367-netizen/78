const DATA={"questions":[{"n":1,"prompt":"Choose the best option to complete blank (1).","opts":{"A":"which","B":"where","C":"whom","D":"whose"},"answer":"A","explain":"'Which' thay cho 'a digital exhibition' (sự vật) và làm chủ ngữ của mệnh đề quan hệ xác định.","section":1},{"n":2,"prompt":"Choose the best option to complete blank (2).","opts":{"A":"to conduct","B":"conducted","C":"conduct","D":"conducting"},"answer":"D","explain":"Sau giới từ 'by' dùng V-ing: by conducting interviews.","section":1},{"n":3,"prompt":"Choose the best option to complete blank (3).","opts":{"A":"valuably","B":"valuable","C":"valuation","D":"value"},"answer":"B","explain":"'Valuable' là tính từ, bổ nghĩa cho danh từ 'insight'.","section":1},{"n":4,"prompt":"Choose the best option to complete blank (4).","opts":{"A":"carefully prepared interview guidelines","B":"guidelines carefully interview prepared","C":"interview prepared carefully guidelines","D":"prepared guidelines interview carefully"},"answer":"A","explain":"Cụm danh từ đúng: carefully (trạng từ) + prepared (phân từ) + interview (danh từ bổ nghĩa) + guidelines (danh từ chính).","section":1},{"n":5,"prompt":"Choose the best option to complete blank (5).","opts":{"A":"give","B":"take","C":"make","D":"do"},"answer":"C","explain":"Cụm từ cố định 'make a contribution' = đóng góp.","section":1},{"n":6,"prompt":"Choose the best option to complete blank (6).","opts":{"A":"among","B":"into","C":"under","D":"over"},"answer":"B","explain":"Cấu trúc 'turn A into B' = chuyển A thành B.","section":1},{"n":7,"prompt":"Choose the best option to complete blank (7).","opts":{"A":"Many","B":"Much","C":"Each","D":"A little"},"answer":"A","explain":"'Many' đi với danh từ đếm được số nhiều 'clothes' và động từ 'are'.","section":2},{"n":8,"prompt":"Choose the best option to complete blank (8).","opts":{"A":"put off","B":"set up","C":"turn down","D":"give away"},"answer":"B","explain":"'Set up collection points' = thiết lập các điểm tiếp nhận; các cụm khác không phù hợp nghĩa.","section":2},{"n":9,"prompt":"Choose the best option to complete blank (9).","opts":{"A":"despite","B":"although","C":"whereas","D":"provided that"},"answer":"D","explain":"'Provided that' đưa ra điều kiện bắt buộc để nhận một món đồ: phải quyên góp trước.","section":2},{"n":10,"prompt":"Choose the best option to complete blank (10).","opts":{"A":"practise","B":"practice","C":"practical","D":"practically"},"answer":"C","explain":"Cần tính từ 'practical' bổ nghĩa cho danh từ 'advice'.","section":2},{"n":11,"prompt":"Choose the best option to complete blank (11).","opts":{"A":"respond","B":"responsibly","C":"responsibility","D":"responsible"},"answer":"D","explain":"Cần tính từ 'responsible' trước danh từ 'consumption'.","section":2},{"n":12,"prompt":"Choose the best option to complete blank (12).","opts":{"A":"from","B":"by","C":"among","D":"towards"},"answer":"B","explain":"'Judge somebody by something' = đánh giá ai dựa trên điều gì.","section":2},{"n":13,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – a – c","B":"c – a – b","C":"a – b – c","D":"b – c – a"},"answer":"A","explain":"b giới thiệu buổi sinh hoạt; a phản hồi và hỏi về phim; c trả lời về lịch chiếu.","arrangementLines":[{"letter":"a","text":"Hoa: That sounds inspiring. Can we watch her documentary at school?"},{"letter":"b","text":"Minh: Our next assembly will introduce an engineer who designed affordable water filters."},{"letter":"c","text":"Minh: Yes. The media club will show it after the talk."}],"section":3},{"n":14,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – d – a – e – c","B":"b – d – a – c – e","C":"b – d – e – a – c","D":"d – b – e – c – a"},"answer":"C","explain":"b đề xuất → d đồng ý và nhận việc → e hỏi bổ sung → a chấp thuận → c kết lại bằng bước chuẩn bị.","arrangementLines":[{"letter":"a","text":"Phuc: Of course. I'll send them both questions this afternoon."},{"letter":"b","text":"Lan: Could we invite exchange students to describe celebrations in their home countries?"},{"letter":"c","text":"Lan: Thanks! Then I can prepare the programme."},{"letter":"d","text":"Phuc: Great idea. I'll ask the exchange students if they're interested."},{"letter":"e","text":"Lan: Could you also check whether they need any equipment?"}],"section":3},{"n":15,"prompt":"Choose the correct order to complete the email.","opts":{"A":"b – c – d – a – e","B":"b – c – a – d – e","C":"b – a – d – e – c","D":"c – b – d – a – e"},"answer":"A","explain":"b nêu lý do viết thư; c cho biết mối quan tâm; d đặt câu hỏi đầu tiên; a bổ sung câu hỏi; e kết thư.","arrangementLines":[{"letter":"a","text":"I would also like to know whether beginners are welcome to participate."},{"letter":"b","text":"I read your announcement about the local history interview project."},{"letter":"c","text":"I enjoy hearing older relatives describe how our area has changed."},{"letter":"d","text":"Could you please tell me when the first training session will take place?"},{"letter":"e","text":"Thank you for your help. I look forward to your reply."}],"section":3},{"n":16,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"c – d – a – e – b","B":"d – e – c – a – b","C":"c – e – d – a – b","D":"c – d – e – a – b"},"answer":"D","explain":"c câu chủ đề → d phát hiện vấn đề → e đề xuất thay đổi → a cho ví dụ → b khái quát lợi ích.","arrangementLines":[{"letter":"a","text":"For instance, a school can arrange activities to make better use of natural daylight."},{"letter":"b","text":"These measures may seem small, but together they can reduce electricity demand."},{"letter":"c","text":"Reducing electricity waste at school begins with observing daily habits."},{"letter":"d","text":"Students can then identify rooms where lights or devices are left on unnecessarily."},{"letter":"e","text":"Once such problems are identified, practical changes can be introduced."}],"section":3},{"n":17,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"b – a – c – e – d","B":"b – c – a – e – d","C":"b – e – a – c – d","D":"e – b – a – c – d"},"answer":"C","explain":"b giới thiệu lễ hội → e nêu lợi ích → a chỉ ra nguy cơ hiểu sai → c giải pháp → d kết luận.","arrangementLines":[{"letter":"a","text":"However, visitors may misunderstand unfamiliar customs if they rely only on brief online summaries."},{"letter":"b","text":"Local festivals give young people a chance to explore the history of their communities."},{"letter":"c","text":"By speaking to organisers and older residents, visitors can discover the meanings behind traditional activities."},{"letter":"d","text":"In this way, respectful participation can build cultural understanding instead of reducing traditions to entertainment."},{"letter":"e","text":"Such events also connect neighbours from different generations."}],"section":3},{"n":18,"prompt":"Choose the best option to complete blank (18).","opts":{"A":"shows how everyday observations can inspire useful inventions","B":"which helped many pupils improve their exam scores","C":"having arranged a completely unrelated sports tournament","D":"whose original idea was never discussed again"},"answer":"A","explain":"Chủ ngữ 'An after-school project' cần vị ngữ hoàn chỉnh 'shows ...'; nội dung nối với ý tưởng từ quan sát đời sống.","section":4},{"n":19,"prompt":"Choose the best option to complete blank (19).","opts":{"A":"who needed her to translate ancient manuscripts","B":"who helped her develop and test a solar lighting system","C":"which had designed a computer game for children","D":"whose main duty was planning a football match"},"answer":"B","explain":"'Who' thay cho 'technicians' chỉ người; các kỹ thuật viên hỗ trợ phát triển và thử đèn phù hợp mạch sự việc.","section":4},{"n":20,"prompt":"Choose the best option to complete blank (20).","opts":{"A":"all families were told that the plan had been cancelled","B":"the technicians decided that no lamps would ever be needed","C":"the prototype was immediately discarded without further testing","D":"they assembled a small number of lamps for a community trial"},"answer":"D","explain":"Sau mệnh đề thời gian là mệnh đề chính; việc làm các mẫu thử cho cộng đồng tạo tiền đề cho câu tiếp theo.","section":4},{"n":21,"prompt":"Choose the best option to complete blank (21).","opts":{"A":"The designers refused to let the lamps be used outside the laboratory","B":"No one offered any suggestions about improving the devices","C":"Several parents suggested adding a stronger handle and a clear charging indicator","D":"The team announced that it would ignore every family comment"},"answer":"C","explain":"Ý kiến gia đình về tay cầm và báo sạc giải thích cụ thể 'this feedback' và các cải tiến sau đó.","section":4},{"n":22,"prompt":"Choose the best option to complete blank (22).","opts":{"A":"New technology has no connection with the needs of communities","B":"A useful invention should solve a real problem rather than merely look impressive","C":"All successful inventions must be expensive to manufacture","D":"Young designers should avoid listening to the people who use their work"},"answer":"B","explain":"Câu cuối khái quát bài học: thiết kế cần đáp ứng nhu cầu thực tế của người dùng.","section":4},{"n":23,"prompt":"Which of the following is NOT mentioned as a benefit of preserving local expressions?","opts":{"A":"Helping younger people understand community history","B":"Supporting discussions in schools","C":"Guaranteeing paid employment for everyone who studies them","D":"Keeping records of speakers’ pronunciation"},"answer":"C","explain":"Bài nói về lịch sử, phát âm và hoạt động học tập; không nói rằng bảo tồn tiếng địa phương bảo đảm việc làm.","section":5},{"n":24,"prompt":"The word “They” in paragraph 2 refers to ______.","opts":{"A":"particular phrases","B":"classroom discussions","C":"older residents","D":"audio recordings"},"answer":"D","explain":"'They' ở câu tiếp theo thay cho 'These recordings' ở câu trước.","section":5},{"n":25,"prompt":"The word “inclusive” in paragraph 3 is OPPOSITE in meaning to ______.","opts":{"A":"welcoming","B":"exclusive","C":"open","D":"accessible"},"answer":"B","explain":"'Inclusive' = bao trùm; trái nghĩa là 'exclusive' = loại trừ/hạn chế sự tham gia.","section":5},{"n":26,"prompt":"The word “Preserving” in paragraph 1 is closest in meaning to ______.","opts":{"A":"replacing","B":"inventing","C":"protecting","D":"ignoring"},"answer":"C","explain":"'Preserving' trong văn cảnh nghĩa là giữ gìn/bảo vệ, gần nghĩa nhất với 'protecting'.","section":5},{"n":27,"prompt":"Which of the following is TRUE according to the passage?","opts":{"A":"Student interviews can document how older residents used local expressions","B":"Recordings may be published without speakers’ permission","C":"Local expressions should never change over time","D":"Every resident in one district speaks in exactly the same way"},"answer":"A","explain":"Đoạn 2 cho biết học sinh phỏng vấn người lớn tuổi, ghi âm có xin phép và giải thích ngữ cảnh sử dụng.","section":5},{"n":28,"prompt":"Which option best paraphrases the sentence “Respecting linguistic variety means recognising that differences in speech do not make one group more intelligent or valuable than another”?","opts":{"A":"Speakers of regional varieties need to adopt one prestigious accent","B":"Language differences show that some communities are naturally more capable","C":"Different ways of speaking should not be used to rank the worth of groups of people","D":"Only officially recognised expressions deserve to be recorded"},"answer":"C","explain":"Câu gốc bác bỏ việc đánh giá trí tuệ hoặc giá trị của một nhóm dựa trên sự khác biệt trong cách nói.","section":5},{"n":29,"prompt":"In which paragraph does the writer discuss the danger of representing a whole community through too few voices?","opts":{"A":"Paragraph 4","B":"Paragraph 2","C":"Paragraph 1","D":"Paragraph 3"},"answer":"D","explain":"Đoạn 3 nhấn mạnh một bản ghi không thể đại diện cho tất cả người nói và cần nhiều đối tượng tham gia.","section":5},{"n":30,"prompt":"In which paragraph are students described as recording local expressions through interviews?","opts":{"A":"Paragraph 2","B":"Paragraph 1","C":"Paragraph 3","D":"Paragraph 4"},"answer":"A","explain":"Đoạn 2 mô tả học sinh phỏng vấn người cao tuổi, ghi âm và bổ sung chú giải.","section":5},{"n":31,"prompt":"Where in paragraph 5 does the following sentence best fit? “These logistical demands can be difficult to manage without a shared collection service.”","opts":{"A":"[I]","B":"[II]","C":"[IV]","D":"[III]"},"answer":"D","explain":"'These logistical demands' liên hệ trực tiếp việc phân loại, rửa và vận chuyển hộp ở câu trước [III], rồi dẫn đến lý do thử nghiệm quy mô nhỏ.","section":6},{"n":32,"prompt":"The word “efficient” in paragraph 2 is OPPOSITE in meaning to ______.","opts":{"A":"economical","B":"wasteful","C":"productive","D":"effective"},"answer":"B","explain":"'Efficient' = hiệu quả, ít lãng phí; trái nghĩa trong ngữ cảnh là 'wasteful'.","section":6},{"n":33,"prompt":"The phrase “trace each container” in paragraph 3 is closest in meaning to ______.","opts":{"A":"measure the weight of each container","B":"wash every container by hand","C":"follow the movement of every container","D":"change the colour of each container"},"answer":"C","explain":"'Trace' nghĩa là theo dõi đường đi của vật qua những điểm thu gom/rửa.","section":6},{"n":34,"prompt":"The word “it” in paragraph 4 refers to ______.","opts":{"A":"a return station","B":"a refundable deposit","C":"a public transport stop","D":"an instruction sheet"},"answer":"B","explain":"Trong câu 'Some retailers request a refundable deposit, and it may encourage...', 'it' thay cho khoản tiền đặt cọc được hoàn lại.","section":6},{"n":35,"prompt":"Which of the following is NOT TRUE according to the passage?","opts":{"A":"A reusable cup is necessarily greener even if it is used only twice","B":"Cleaning reusable containers uses water and energy","C":"Returning items conveniently can increase participation","D":"A trial can reveal which locations frequently lose containers"},"answer":"A","explain":"Đoạn 2 khẳng định dùng rất ít lần có thể không tạo lợi ích môi trường đáng kể; từ 'necessarily' làm mệnh đề sai.","section":6},{"n":36,"prompt":"Which option best summarises paragraph 3?","opts":{"A":"Every small reuse project needs expensive tracking software","B":"Tracking containers helps reduce losses, but the method should remain practical","C":"People always return borrowed containers without reminders","D":"Organisers should avoid counting containers at local events"},"answer":"B","explain":"Đoạn 3 giải thích việc theo dõi hành trình vật dụng và lựa chọn công cụ phù hợp quy mô để tránh thất lạc.","section":6},{"n":37,"prompt":"Which of the following is TRUE according to the passage?","opts":{"A":"A deposit removes the need for clear instructions","B":"Reusable cups create no impacts during manufacturing","C":"Containers must always be washed at separate distant locations","D":"Convenient return locations make it easier for customers to reuse packaging"},"answer":"D","explain":"Đoạn 4 nêu vị trí điểm trả thuận tiện có vai trò quan trọng đối với sự tham gia.","section":6},{"n":38,"prompt":"Which option best paraphrases the sentence “The environmental value of reusable packaging depends on how the system is operated, not just on the material from which containers are made”?","opts":{"A":"Its environmental benefits depend on the whole process, not merely what the packaging is made of","B":"The operation of a return scheme matters less than a container’s appearance","C":"Selecting a durable material guarantees environmental benefits in every situation","D":"Reusable packaging is always harmful regardless of how it is used"},"answer":"A","explain":"Câu gốc yêu cầu đánh giá cả quá trình thu hồi, rửa và dùng lại thay vì chỉ dựa vào chất liệu.","section":6},{"n":39,"prompt":"What can be inferred from the passage?","opts":{"A":"Reusable packaging should never be used at school events","B":"Successful reuse programmes require coordination among businesses and users","C":"Individual customers can guarantee success without collection services","D":"The number of times an item is reused has no effect on its impact"},"answer":"B","explain":"Kết hợp các đoạn 2–5 suy ra hệ thống cần người sử dụng, doanh nghiệp và đơn vị tổ chức phối hợp.","section":6},{"n":40,"prompt":"Which title best summarises the passage?","opts":{"A":"The History of Paper Containers in Public Markets","B":"How to Design the Most Attractive Disposable Cups","C":"Why Packaging Materials Are the Only Environmental Concern","D":"Reusable Packaging: Benefits Depend on the System"},"answer":"D","explain":"Toàn bài trình bày lợi ích, điều kiện thực hiện và giới hạn của hệ thống bao bì tái sử dụng.","section":6}],"sections":[{"id":1,"title":"TASK 1 – ADVERTISEMENT","range":[1,6],"passage":"ADVERTISEMENT – HELP TELL OUR TOWN'S STORIES!","text":"Our History Club is creating a digital exhibition (1) ______ tells the stories of people who have improved our town. We need students to help by (2) ______ interviews with neighbours and collecting old photographs. Each personal account offers a (3) ______ insight into the community's past. All volunteers will receive (4) ______ before speaking to residents. You can (5) ______ a valuable contribution even if you have never interviewed anyone before. With permission from the speakers, we will turn selected conversations (6) ______ short audio guides for visitors. Join the introductory meeting in Room 12 on Thursday!","translation":"QUẢNG CÁO – HÃY CÙNG KỂ NHỮNG CÂU CHUYỆN CỦA THỊ TRẤN CHÚNG TA!\nCâu lạc bộ Lịch sử của chúng tôi đang tạo một triển lãm kỹ thuật số kể về những người đã góp phần cải thiện thị trấn. Chúng tôi cần học sinh giúp đỡ bằng cách thực hiện các cuộc phỏng vấn với hàng xóm và thu thập những bức ảnh cũ. Mỗi câu chuyện cá nhân mang đến một góc nhìn sâu sắc có giá trị về quá khứ của cộng đồng. Tất cả tình nguyện viên sẽ nhận được các hướng dẫn phỏng vấn được chuẩn bị cẩn thận trước khi trò chuyện với người dân. Bạn có thể đóng góp có ý nghĩa ngay cả khi trước đây bạn chưa từng phỏng vấn ai. Với sự cho phép của người được phỏng vấn, chúng tôi sẽ chuyển những cuộc trò chuyện được chọn thành các hướng dẫn âm thanh ngắn dành cho khách tham quan. Hãy tham gia buổi họp giới thiệu tại Phòng 12 vào thứ Năm!"},{"id":2,"title":"TASK 2 – LEAFLET","range":[7,12],"passage":"LEAFLET – CLOTHES SWAP: WEAR MORE, WASTE LESS","text":"Give good clothes another life at our school clothes swap! (7) ______ clothes are thrown away while they are still in good condition. Our volunteers will (8) ______ collection points in the main hall on Friday. You may choose one item to take home (9) ______ you donate a clean, wearable item first. A sewing team will offer (10) ______ advice on replacing buttons and repairing small tears. The event promotes (11) ______ consumption and helps families reduce unnecessary purchases. We welcome clothes in a wide range of sizes, and nobody will be judged (12) ______ the price or brand of what they bring. Wash your donations before arriving, and remember: sharing is more sustainable than wasting!","translation":"TỜ RƠI – ĐỔI QUẦN ÁO: MẶC NHIỀU HƠN, LÃNG PHÍ ÍT HƠN\nHãy trao cho những bộ quần áo còn tốt một cuộc đời mới tại sự kiện đổi quần áo của trường chúng ta! Nhiều quần áo bị vứt bỏ dù chúng vẫn còn trong tình trạng tốt. Các tình nguyện viên sẽ thiết lập những điểm tiếp nhận ở sảnh chính vào thứ Sáu. Bạn có thể chọn một món đồ mang về với điều kiện bạn quyên góp trước một món đồ sạch và còn mặc được. Một nhóm may vá sẽ đưa ra lời khuyên thiết thực về việc thay cúc áo và sửa những vết rách nhỏ. Sự kiện khuyến khích tiêu dùng có trách nhiệm và giúp các gia đình giảm việc mua sắm không cần thiết. Chúng tôi nhận quần áo với nhiều kích cỡ khác nhau và không ai bị đánh giá dựa trên giá cả hay nhãn hiệu của món đồ họ mang đến. Hãy giặt sạch quần áo quyên góp trước khi đến và nhớ rằng: chia sẻ bền vững hơn lãng phí!"},{"id":3,"title":"TASK 3 – ARRANGEMENT","range":[13,17],"passage":null,"text":null,"translation":""},{"id":4,"title":"TASK 4 – EXTENDED CLOZE","range":[18,22],"passage":"A SOLAR LAMP INSPIRED BY A SIMPLE QUESTION","text":"An after-school project led by science student Nhi (18) ______. During power cuts in a rural community, she noticed that younger children struggled to read after sunset. She contacted local technicians (19) ______. Once the students had tested several prototypes, (20) ______. They then invited families to try the lamps and explain which features were useful in daily life. (21) ______. By listening to this feedback, the team improved the lamps' durability and made them easier to carry. The experience taught the young designers a lasting lesson about innovation. (22) ______.","translation":"MỘT CHIẾC ĐÈN NĂNG LƯỢNG MẶT TRỜI BẮT NGUỒN TỪ MỘT CÂU HỎI ĐƠN GIẢN\nMột dự án sau giờ học do Nhi, học sinh yêu thích khoa học, dẫn dắt cho thấy những quan sát trong đời sống hằng ngày có thể truyền cảm hứng cho các phát minh hữu ích như thế nào. Trong những lần mất điện tại một cộng đồng nông thôn, bạn nhận thấy trẻ nhỏ gặp khó khăn khi đọc sách sau hoàng hôn. Bạn liên hệ với các kỹ thuật viên địa phương, những người đã giúp bạn phát triển và thử nghiệm một hệ thống chiếu sáng bằng năng lượng mặt trời. Sau khi học sinh thử nghiệm một số nguyên mẫu, các bạn đã lắp ráp một số lượng nhỏ đèn để thử nghiệm trong cộng đồng. Sau đó, họ mời các gia đình dùng thử đèn và giải thích những tính năng nào hữu ích trong cuộc sống hằng ngày. Một số phụ huynh đề nghị bổ sung tay cầm chắc chắn hơn và đèn báo sạc rõ ràng. Bằng cách lắng nghe phản hồi này, nhóm đã cải thiện độ bền của đèn và giúp chúng dễ mang theo hơn. Trải nghiệm này dạy những nhà thiết kế trẻ một bài học lâu dài về sự đổi mới. Một phát minh hữu ích nên giải quyết một vấn đề thực tế thay vì chỉ trông thật ấn tượng."},{"id":5,"title":"TASK 5 – READING COMPREHENSION","range":[23,30],"passage":"KEEPING LOCAL EXPRESSIONS ALIVE","text":"Traditional sayings, greetings and local expressions can reveal how a community understands its history. Some phrases describe farming methods, seasonal weather or everyday relationships that have changed over time. As people move and communicate with wider audiences, younger generations may hear these expressions less often. Preserving them does not mean preventing language from changing. Instead, it means giving people opportunities to understand the words that connect them with earlier generations and with the places they call home.\n\nIn several communities, students have begun interviewing older residents about expressions they remember from childhood. With the speakers' permission, they make audio recordings and add explanations of when particular phrases are used. These recordings preserve pronunciation and personal memories, not merely written definitions. They can support school exhibitions, local history websites and classroom discussions. Interviewers also learn that the same expression may carry different shades of meaning depending on who uses it and in what situation.\n\nHowever, documenting local language requires care. A single recording cannot represent every speaker in a district, and expressions sometimes differ even between neighbouring villages. Projects should therefore invite contributions from people of different ages and backgrounds. An inclusive approach also avoids treating one way of speaking as more respectable than another. Respecting linguistic variety means recognising that differences in speech do not make one group more intelligent or valuable than another. Careful listening is more useful than correcting people for speaking differently.\n\nCommunity participation can keep such projects relevant. Teachers may help students prepare clear questions, while libraries can store recordings securely and explain how they may be used. Residents can review descriptions of their own expressions before these descriptions are published. Some people may prefer not to share a private family story, and their choice should be respected. When a project combines informed consent, careful research and local involvement, it can celebrate language heritage without turning living traditions into museum objects.","translation":"GIỮ GÌN NHỮNG CÁCH DIỄN ĐẠT ĐỊA PHƯƠNG\nNhững câu nói, lời chào và cách diễn đạt truyền thống ở địa phương có thể cho thấy một cộng đồng hiểu lịch sử của mình như thế nào. Một số cụm từ mô tả phương pháp canh tác, thời tiết theo mùa hoặc các mối quan hệ thường ngày đã thay đổi theo thời gian. Khi mọi người di chuyển và giao tiếp với nhiều đối tượng hơn, thế hệ trẻ có thể ít nghe thấy những cách diễn đạt này hơn. Việc bảo tồn chúng không có nghĩa là ngăn ngôn ngữ thay đổi. Thay vào đó, điều đó có nghĩa là tạo cơ hội để mọi người hiểu những từ ngữ kết nối họ với các thế hệ trước và với nơi họ gọi là quê hương.\nỞ một số cộng đồng, học sinh đã bắt đầu phỏng vấn những cư dân lớn tuổi về những cách diễn đạt mà họ nhớ từ thời thơ ấu. Với sự cho phép của người nói, các em ghi âm và bổ sung giải thích về thời điểm sử dụng những cụm từ cụ thể. Những bản ghi âm này lưu giữ cách phát âm và ký ức cá nhân, chứ không chỉ đơn thuần là các định nghĩa bằng văn bản. Chúng có thể hỗ trợ các triển lãm ở trường, trang web lịch sử địa phương và các cuộc thảo luận trong lớp học. Người phỏng vấn cũng nhận ra rằng cùng một cách diễn đạt có thể mang những sắc thái ý nghĩa khác nhau tùy thuộc vào người sử dụng và tình huống.\nTuy nhiên, việc ghi chép ngôn ngữ địa phương đòi hỏi sự cẩn trọng. Một bản ghi âm đơn lẻ không thể đại diện cho tất cả người nói trong một huyện, và cách diễn đạt đôi khi khác nhau ngay cả giữa các làng lân cận. Vì vậy, các dự án nên mời đóng góp từ những người ở nhiều độ tuổi và hoàn cảnh khác nhau. Cách tiếp cận bao trùm cũng tránh xem một cách nói là đáng tôn trọng hơn cách nói khác. Tôn trọng sự đa dạng ngôn ngữ có nghĩa là nhận ra rằng sự khác biệt trong cách nói không khiến nhóm này thông minh hay có giá trị hơn nhóm khác. Lắng nghe cẩn thận hữu ích hơn việc sửa lỗi người khác chỉ vì họ nói khác mình.\nSự tham gia của cộng đồng có thể giúp các dự án như vậy luôn phù hợp. Giáo viên có thể giúp học sinh chuẩn bị những câu hỏi rõ ràng, trong khi thư viện có thể lưu trữ bản ghi âm an toàn và giải thích cách sử dụng chúng. Người dân có thể xem lại phần mô tả về cách diễn đạt của chính họ trước khi những mô tả này được công bố. Một số người có thể không muốn chia sẻ câu chuyện riêng tư của gia đình, và lựa chọn đó cần được tôn trọng. Khi một dự án kết hợp sự đồng ý có hiểu biết, nghiên cứu cẩn thận và sự tham gia của địa phương, dự án có thể tôn vinh di sản ngôn ngữ mà không biến những truyền thống đang sống thành hiện vật bảo tàng."},{"id":6,"title":"TASK 6 – ADVANCED READING","range":[31,40],"passage":"REUSABLE PACKAGING: THE SYSTEM MATTERS","text":"Reusable cups and food containers are becoming more common at cafes, markets and school events. Their appeal is easy to understand: using the same container repeatedly may reduce demand for disposable packaging. However, simply replacing a paper cup with a heavier reusable one does not guarantee an environmental benefit. The environmental value of reusable packaging depends on how the system is operated, not just on the material from which containers are made. To assess a scheme fairly, we must consider how often items are returned, washed and used again.\n\nEach reusable container requires resources to manufacture, and cleaning it consumes water and energy. These costs can be worthwhile when an item replaces many disposable alternatives. An efficient washing process helps, especially when containers are cleaned together rather than transported individually over long distances. On the other hand, if a cup is used only twice before being lost, its environmental advantage may be limited. This is why organisers need reliable information about how their systems actually perform.\n\nOne challenge is keeping track of items as they move between customers and businesses. Some schemes use simple labels or codes to trace each container from a collection point back to a washing facility. Such records can show which locations receive many returns and which regularly lose items. Yet sophisticated technology is not always necessary: for a small event, careful manual counts may provide enough information. The aim is to reduce losses without making participation complicated or expensive.\n\nConvenience also shapes people's willingness to take part. If customers must travel far to return containers, even environmentally concerned users may give up. Placing return stations near entrances or public transport stops can make the process easier. Some retailers request a refundable deposit, and it may encourage customers to bring containers back. Nevertheless, a deposit cannot compensate for confusing instructions or return points that are rarely open. Clear communication and accessible locations are just as important as financial incentives.\n\n[I] A reuse scheme needs support long after its launch. [II] Returned boxes must be sorted, cleaned and delivered where needed, which can be costly for small shops. [III] As a result, organisers often begin with a limited trial before expanding their network. [IV] During a trial, they can measure return rates and identify points where containers tend to go missing. Local authorities, businesses and customers all have a part to play. Successful reuse is therefore not a property of one cup or box; it is the outcome of a practical system that people can use consistently.","translation":"BAO BÌ TÁI SỬ DỤNG: HỆ THỐNG MỚI LÀ ĐIỀU QUAN TRỌNG\nCốc và hộp đựng thức ăn có thể tái sử dụng đang trở nên phổ biến hơn tại các quán cà phê, khu chợ và sự kiện ở trường học. Sức hấp dẫn của chúng rất dễ hiểu: sử dụng cùng một chiếc hộp nhiều lần có thể làm giảm nhu cầu về bao bì dùng một lần. Tuy nhiên, chỉ đơn giản thay một chiếc cốc giấy bằng một chiếc cốc tái sử dụng nặng hơn không đảm bảo mang lại lợi ích môi trường. Giá trị môi trường của bao bì tái sử dụng phụ thuộc vào cách hệ thống được vận hành, chứ không chỉ vào vật liệu làm ra các hộp đựng. Để đánh giá công bằng một chương trình, chúng ta phải xem xét các vật dụng được trả lại, rửa sạch và sử dụng lại thường xuyên đến mức nào.\nMỗi hộp đựng có thể tái sử dụng đều cần tài nguyên để sản xuất, và việc làm sạch chúng tiêu tốn nước và năng lượng. Những chi phí này có thể đáng giá khi một vật dụng thay thế được nhiều sản phẩm dùng một lần. Quy trình rửa hiệu quả sẽ hữu ích, đặc biệt khi các hộp được làm sạch cùng nhau thay vì được vận chuyển riêng lẻ trên những quãng đường dài. Mặt khác, nếu một chiếc cốc chỉ được dùng hai lần rồi bị thất lạc, lợi ích môi trường của nó có thể bị hạn chế. Đây là lý do những người tổ chức cần thông tin đáng tin cậy về hiệu quả thực tế của hệ thống.\nMột thách thức là theo dõi các vật dụng khi chúng di chuyển giữa khách hàng và doanh nghiệp. Một số chương trình sử dụng nhãn hoặc mã đơn giản để theo dõi từng hộp đựng từ điểm thu gom trở lại cơ sở rửa. Những hồ sơ này có thể cho thấy địa điểm nào nhận được nhiều đồ trả lại và địa điểm nào thường xuyên bị thất lạc vật dụng. Tuy nhiên, công nghệ phức tạp không phải lúc nào cũng cần thiết: đối với một sự kiện nhỏ, việc đếm thủ công cẩn thận có thể cung cấp đủ thông tin. Mục tiêu là giảm thất thoát mà không khiến việc tham gia trở nên phức tạp hoặc tốn kém.\nSự thuận tiện cũng ảnh hưởng đến mức độ sẵn lòng tham gia của mọi người. Nếu khách hàng phải đi xa để trả lại hộp đựng, ngay cả những người quan tâm đến môi trường cũng có thể bỏ cuộc. Đặt các điểm trả lại gần lối vào hoặc trạm giao thông công cộng có thể giúp quy trình dễ dàng hơn. Một số nhà bán lẻ yêu cầu đặt cọc có hoàn tiền và điều này có thể khuyến khích khách hàng mang hộp trở lại. Tuy nhiên, tiền đặt cọc không thể bù đắp cho hướng dẫn khó hiểu hoặc các điểm trả đồ hiếm khi mở cửa. Việc truyền đạt rõ ràng và địa điểm dễ tiếp cận cũng quan trọng như các khuyến khích tài chính.\n[I] Một chương trình tái sử dụng cần được hỗ trợ lâu dài sau khi ra mắt. [II] Các hộp được trả lại phải được phân loại, làm sạch và vận chuyển đến nơi cần thiết, điều này có thể tốn kém đối với các cửa hàng nhỏ. [III] Những yêu cầu hậu cần này có thể khó quản lý nếu không có dịch vụ thu gom chung. [IV] Do đó, những người tổ chức thường bắt đầu bằng một thử nghiệm giới hạn trước khi mở rộng mạng lưới. Trong thời gian thử nghiệm, họ có thể đo lường tỷ lệ trả lại và xác định những điểm mà hộp đựng thường bị thất lạc. Chính quyền địa phương, doanh nghiệp và khách hàng đều có vai trò riêng. Vì vậy, việc tái sử dụng thành công không phải là đặc tính của một chiếc cốc hay chiếc hộp; đó là kết quả của một hệ thống thực tế mà mọi người có thể sử dụng một cách nhất quán."}],"translations":{"ADVERTISEMENT – HELP TELL OUR TOWN'S STORIES!":"QUẢNG CÁO – HÃY CÙNG KỂ NHỮNG CÂU CHUYỆN CỦA THỊ TRẤN CHÚNG TA!\nCâu lạc bộ Lịch sử của chúng tôi đang tạo một triển lãm kỹ thuật số kể về những người đã góp phần cải thiện thị trấn. Chúng tôi cần học sinh giúp đỡ bằng cách thực hiện các cuộc phỏng vấn với hàng xóm và thu thập những bức ảnh cũ. Mỗi câu chuyện cá nhân mang đến một góc nhìn sâu sắc có giá trị về quá khứ của cộng đồng. Tất cả tình nguyện viên sẽ nhận được các hướng dẫn phỏng vấn được chuẩn bị cẩn thận trước khi trò chuyện với người dân. Bạn có thể đóng góp có ý nghĩa ngay cả khi trước đây bạn chưa từng phỏng vấn ai. Với sự cho phép của người được phỏng vấn, chúng tôi sẽ chuyển những cuộc trò chuyện được chọn thành các hướng dẫn âm thanh ngắn dành cho khách tham quan. Hãy tham gia buổi họp giới thiệu tại Phòng 12 vào thứ Năm!","LEAFLET – CLOTHES SWAP: WEAR MORE, WASTE LESS":"TỜ RƠI – ĐỔI QUẦN ÁO: MẶC NHIỀU HƠN, LÃNG PHÍ ÍT HƠN\nHãy trao cho những bộ quần áo còn tốt một cuộc đời mới tại sự kiện đổi quần áo của trường chúng ta! Nhiều quần áo bị vứt bỏ dù chúng vẫn còn trong tình trạng tốt. Các tình nguyện viên sẽ thiết lập những điểm tiếp nhận ở sảnh chính vào thứ Sáu. Bạn có thể chọn một món đồ mang về với điều kiện bạn quyên góp trước một món đồ sạch và còn mặc được. Một nhóm may vá sẽ đưa ra lời khuyên thiết thực về việc thay cúc áo và sửa những vết rách nhỏ. Sự kiện khuyến khích tiêu dùng có trách nhiệm và giúp các gia đình giảm việc mua sắm không cần thiết. Chúng tôi nhận quần áo với nhiều kích cỡ khác nhau và không ai bị đánh giá dựa trên giá cả hay nhãn hiệu của món đồ họ mang đến. Hãy giặt sạch quần áo quyên góp trước khi đến và nhớ rằng: chia sẻ bền vững hơn lãng phí!","A SOLAR LAMP INSPIRED BY A SIMPLE QUESTION":"MỘT CHIẾC ĐÈN NĂNG LƯỢNG MẶT TRỜI BẮT NGUỒN TỪ MỘT CÂU HỎI ĐƠN GIẢN\nMột dự án sau giờ học do Nhi, học sinh yêu thích khoa học, dẫn dắt cho thấy những quan sát trong đời sống hằng ngày có thể truyền cảm hứng cho các phát minh hữu ích như thế nào. Trong những lần mất điện tại một cộng đồng nông thôn, bạn nhận thấy trẻ nhỏ gặp khó khăn khi đọc sách sau hoàng hôn. Bạn liên hệ với các kỹ thuật viên địa phương, những người đã giúp bạn phát triển và thử nghiệm một hệ thống chiếu sáng bằng năng lượng mặt trời. Sau khi học sinh thử nghiệm một số nguyên mẫu, các bạn đã lắp ráp một số lượng nhỏ đèn để thử nghiệm trong cộng đồng. Sau đó, họ mời các gia đình dùng thử đèn và giải thích những tính năng nào hữu ích trong cuộc sống hằng ngày. Một số phụ huynh đề nghị bổ sung tay cầm chắc chắn hơn và đèn báo sạc rõ ràng. Bằng cách lắng nghe phản hồi này, nhóm đã cải thiện độ bền của đèn và giúp chúng dễ mang theo hơn. Trải nghiệm này dạy những nhà thiết kế trẻ một bài học lâu dài về sự đổi mới. Một phát minh hữu ích nên giải quyết một vấn đề thực tế thay vì chỉ trông thật ấn tượng.","KEEPING LOCAL EXPRESSIONS ALIVE":"GIỮ GÌN NHỮNG CÁCH DIỄN ĐẠT ĐỊA PHƯƠNG\nNhững câu nói, lời chào và cách diễn đạt truyền thống ở địa phương có thể cho thấy một cộng đồng hiểu lịch sử của mình như thế nào. Một số cụm từ mô tả phương pháp canh tác, thời tiết theo mùa hoặc các mối quan hệ thường ngày đã thay đổi theo thời gian. Khi mọi người di chuyển và giao tiếp với nhiều đối tượng hơn, thế hệ trẻ có thể ít nghe thấy những cách diễn đạt này hơn. Việc bảo tồn chúng không có nghĩa là ngăn ngôn ngữ thay đổi. Thay vào đó, điều đó có nghĩa là tạo cơ hội để mọi người hiểu những từ ngữ kết nối họ với các thế hệ trước và với nơi họ gọi là quê hương.\nỞ một số cộng đồng, học sinh đã bắt đầu phỏng vấn những cư dân lớn tuổi về những cách diễn đạt mà họ nhớ từ thời thơ ấu. Với sự cho phép của người nói, các em ghi âm và bổ sung giải thích về thời điểm sử dụng những cụm từ cụ thể. Những bản ghi âm này lưu giữ cách phát âm và ký ức cá nhân, chứ không chỉ đơn thuần là các định nghĩa bằng văn bản. Chúng có thể hỗ trợ các triển lãm ở trường, trang web lịch sử địa phương và các cuộc thảo luận trong lớp học. Người phỏng vấn cũng nhận ra rằng cùng một cách diễn đạt có thể mang những sắc thái ý nghĩa khác nhau tùy thuộc vào người sử dụng và tình huống.\nTuy nhiên, việc ghi chép ngôn ngữ địa phương đòi hỏi sự cẩn trọng. Một bản ghi âm đơn lẻ không thể đại diện cho tất cả người nói trong một huyện, và cách diễn đạt đôi khi khác nhau ngay cả giữa các làng lân cận. Vì vậy, các dự án nên mời đóng góp từ những người ở nhiều độ tuổi và hoàn cảnh khác nhau. Cách tiếp cận bao trùm cũng tránh xem một cách nói là đáng tôn trọng hơn cách nói khác. Tôn trọng sự đa dạng ngôn ngữ có nghĩa là nhận ra rằng sự khác biệt trong cách nói không khiến nhóm này thông minh hay có giá trị hơn nhóm khác. Lắng nghe cẩn thận hữu ích hơn việc sửa lỗi người khác chỉ vì họ nói khác mình.\nSự tham gia của cộng đồng có thể giúp các dự án như vậy luôn phù hợp. Giáo viên có thể giúp học sinh chuẩn bị những câu hỏi rõ ràng, trong khi thư viện có thể lưu trữ bản ghi âm an toàn và giải thích cách sử dụng chúng. Người dân có thể xem lại phần mô tả về cách diễn đạt của chính họ trước khi những mô tả này được công bố. Một số người có thể không muốn chia sẻ câu chuyện riêng tư của gia đình, và lựa chọn đó cần được tôn trọng. Khi một dự án kết hợp sự đồng ý có hiểu biết, nghiên cứu cẩn thận và sự tham gia của địa phương, dự án có thể tôn vinh di sản ngôn ngữ mà không biến những truyền thống đang sống thành hiện vật bảo tàng.","REUSABLE PACKAGING: THE SYSTEM MATTERS":"BAO BÌ TÁI SỬ DỤNG: HỆ THỐNG MỚI LÀ ĐIỀU QUAN TRỌNG\nCốc và hộp đựng thức ăn có thể tái sử dụng đang trở nên phổ biến hơn tại các quán cà phê, khu chợ và sự kiện ở trường học. Sức hấp dẫn của chúng rất dễ hiểu: sử dụng cùng một chiếc hộp nhiều lần có thể làm giảm nhu cầu về bao bì dùng một lần. Tuy nhiên, chỉ đơn giản thay một chiếc cốc giấy bằng một chiếc cốc tái sử dụng nặng hơn không đảm bảo mang lại lợi ích môi trường. Giá trị môi trường của bao bì tái sử dụng phụ thuộc vào cách hệ thống được vận hành, chứ không chỉ vào vật liệu làm ra các hộp đựng. Để đánh giá công bằng một chương trình, chúng ta phải xem xét các vật dụng được trả lại, rửa sạch và sử dụng lại thường xuyên đến mức nào.\nMỗi hộp đựng có thể tái sử dụng đều cần tài nguyên để sản xuất, và việc làm sạch chúng tiêu tốn nước và năng lượng. Những chi phí này có thể đáng giá khi một vật dụng thay thế được nhiều sản phẩm dùng một lần. Quy trình rửa hiệu quả sẽ hữu ích, đặc biệt khi các hộp được làm sạch cùng nhau thay vì được vận chuyển riêng lẻ trên những quãng đường dài. Mặt khác, nếu một chiếc cốc chỉ được dùng hai lần rồi bị thất lạc, lợi ích môi trường của nó có thể bị hạn chế. Đây là lý do những người tổ chức cần thông tin đáng tin cậy về hiệu quả thực tế của hệ thống.\nMột thách thức là theo dõi các vật dụng khi chúng di chuyển giữa khách hàng và doanh nghiệp. Một số chương trình sử dụng nhãn hoặc mã đơn giản để theo dõi từng hộp đựng từ điểm thu gom trở lại cơ sở rửa. Những hồ sơ này có thể cho thấy địa điểm nào nhận được nhiều đồ trả lại và địa điểm nào thường xuyên bị thất lạc vật dụng let sectionId=1, index=0, chosen={};
const $=id=>document.getElementById(id);
function unlock(){if($('pw').value==='367'){$('login').classList.add('hidden');$('app').classList.remove('hidden');buildNav();render()}else $('loginMsg').textContent='Incorrect password. Please try again.'}
function currentSection(){return DATA.sections.find(s=>s.id===sectionId)}
function qs(){return DATA.questions.filter(q=>q.section===sectionId)}
function buildNav(){$('sectionNav').innerHTML=DATA.sections.map(s=>`<button class="${s.id===sectionId?'active':''}" onclick="switchSection(${s.id})">${s.title}</button>`).join('')}
function switchSection(id){sectionId=id;index=0;buildNav();render()}
function render(){let s=currentSection(),list=qs(),q=list[index];$('sectionTag').textContent=`SECTION ${sectionId} / 6`;$('sectionTitle').textContent=s.title;$('qnum').textContent=`QUESTION ${q.n}`;$('progress').textContent=`${index+1} / ${list.length}`;$('prompt').textContent=q.prompt;
let passage=s.text;$('reading').classList.toggle('hidden',!passage);
if(passage){$('passageTitle').textContent=s.passage;$('passageText').textContent=passage;$('translationText').textContent=s.translation||'Bản dịch chưa có trong dữ liệu.';$('translationBox').classList.remove('show');$('translateBtn').textContent='🇻🇳 Show Vietnamese translation'}
if(sectionId===3){
 const lines=(q.arrangementLines||[]).map(x=>`<div class="arrange-line"><b>${x.letter}.</b> ${esc(x.text)}</div>`).join('');
 const opts=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="arrange-choice ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
 $('options').innerHTML=`<div class="arrange-grid"><section class="arrange-panel"><h4>Utterances / Sentences</h4>${lines}</section><section class="arrange-panel"><h4>Choose the correct order</h4>${opts}</section></div>`;
}else{
 $('options').innerHTML=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="option ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
}
let fb='';if(chosen[q.n]){let ok=chosen[q.n]===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct!':'Not quite.'}</b><br>Correct answer: <b>${q.answer}</b><br><b>Giải thích:</b> ${esc(q.explain)}<br><span class="small">Bạn đã chọn ${chosen[q.n]}.</span></div>`}$('feedback').innerHTML=fb;
$('prev').disabled=index===0;$('next').disabled=index===list.length-1;$('next').textContent=index===list.length-1?'End of section':'Next →';updateScore()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTranslation(){let box=$('translationBox');box.classList.toggle('show');$('translateBtn').textContent=box.classList.contains('show')?'Hide Vietnamese translation':'🇻🇳 Show Vietnamese translation'}
function answer(k){let q=qs()[index];if(chosen[q.n])return;chosen[q.n]=k;render()}
function move(d){index=Math.max(0,Math.min(qs().length-1,index+d));render()}
function updateScore(){let list=qs(),done=list.filter(q=>chosen[q.n]).length,correct=list.filter(q=>chosen[q.n]===q.answer).length;let t=`Score: ${correct} / ${list.length} · Answered: ${done} / ${list.length}`;$('score').textContent=t;$('bottomScore').textContent=t}
function resetSection(){if(!confirm('Reset all answers in this section?'))return;qs().forEach(q=>delete chosen[q.n]);index=0;render()}
</script></body></html>
